# Blueprint de deploy no Render — https://render.com/docs/blueprint-spec
# Site estático (HTML/CSS/JS). O conteúdo fica na subpasta "docs/",
# a mesma usada pela Netlify e pelo GitHub Pages. Não há etapa de build.
services:
  - type: web
    name: jb-cargo
    runtime: static
    # Sem build: apenas confirma que não há etapa de compilação.
    buildCommand: "echo 'Site estatico — sem etapa de build'"
    # Pasta publicada (onde está o index.html).
    staticPublishPath: ./docs
    pullRequestPreviewsEnabled: false
